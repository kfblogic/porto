<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('porto-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          else document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio - Professional Developer Portfolio showcasing projects, skills, and experience" />
    <meta name="keywords" content="portfolio, developer, fullstack, react, web development" />
    <meta name="author" content="Kevin" />
    <title>Portfolio | Developer</title>
  </head>
  <body>
    <!--

      STORY: a recruiter reads the page like `git log --graph` — one branch line down the page, each section a commit, skills as a diffstat, GitHub activity as the real log it already is.
      FIRST VIEWPORT: branch rail + commit dot left, HEAD commit (name, role, diffstat) right; tech-stack badges read as `+` added lines.
      FORM: Commit Log (assigned direction, index 5 of 7), seed key 6f815be4.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
